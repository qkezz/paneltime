name: Build Plasma package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable package and sources
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: paneltime-packages
          path: dist/*
          if-no-files-found: error
